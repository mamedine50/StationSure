<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StationSûre — Paiement Wave / Orange Money</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#0E1311;font-family:'IBM Plex Sans',sans-serif;color:#EEF2EF}
button,input{font-family:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 900px; box-sizing: border-box; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px; background: #0E1311; color: #EEF2EF; font-family: 'IBM Plex Sans', sans-serif">
  <div style="display: flex; align-items: center; gap: 12px">
    <button aria-label="Retour" style="width: 44px; height: 44px; border-radius: 12px; background: #161D1A; border: 1px solid #2A3530; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF2EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column">
      <span style="font-family: Sora, sans-serif; font-weight: 700; font-size: 18px">Encaisser</span>
      <span style="font-size: 12px; color: #A3B0AA">Awa Diop · pompe 2</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; background: #161D1A; border: 1px solid #2A3530; border-radius: 14px">
    <span style="font-size: 12px; color: #A3B0AA">Montant à encaisser</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 600">15 000 <span style="font-size: 14px; color: #A3B0AA">FCFA</span></span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
    <button style="height: 44px; border-radius: 10px; background: #161D1A; border: 1px solid #2A3530; color: #C9D3CE; font-size: 12px">Espèces</button>
    <button style="height: 44px; border-radius: 10px; background: #221C10; border: 2px solid #F2A541; color: #F2A541; font-size: 12px; font-weight: 600">Wave</button>
    <button style="height: 44px; border-radius: 10px; background: #161D1A; border: 1px solid #2A3530; color: #C9D3CE; font-size: 12px">Orange M.</button>
    <button style="height: 44px; border-radius: 10px; background: #161D1A; border: 1px solid #2A3530; color: #C9D3CE; font-size: 12px">Carte</button>
    <button style="height: 44px; border-radius: 10px; background: #161D1A; border: 1px solid #2A3530; color: #C9D3CE; font-size: 12px">Crédit</button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px; background: #161D1A; border: 1px solid #2A3530; border-radius: 16px">
    <span style="font-size: 13px; color: #A3B0AA">1. Le client scanne le QR marchand</span>
    <div style="width: 168px; height: 168px; border-radius: 12px; background: #EEF2EF; display: flex; align-items: center; justify-content: center">
      <svg width="140" height="140" viewBox="0 0 21 21" role="img" aria-label="QR marchand (illustration)" shape-rendering="crispEdges">
        <rect x="0" y="0" width="7" height="7" fill="#111"></rect><rect x="1" y="1" width="5" height="5" fill="#EEF2EF"></rect><rect x="2" y="2" width="3" height="3" fill="#111"></rect>
        <rect x="14" y="0" width="7" height="7" fill="#111"></rect><rect x="15" y="1" width="5" height="5" fill="#EEF2EF"></rect><rect x="16" y="2" width="3" height="3" fill="#111"></rect>
        <rect x="0" y="14" width="7" height="7" fill="#111"></rect><rect x="1" y="15" width="5" height="5" fill="#EEF2EF"></rect><rect x="2" y="16" width="3" height="3" fill="#111"></rect>
        <rect x="8" y="1" width="1" height="2" fill="#111"></rect><rect x="10" y="0" width="2" height="1" fill="#111"></rect><rect x="9" y="4" width="3" height="1" fill="#111"></rect><rect x="11" y="2" width="1" height="3" fill="#111"></rect>
        <rect x="8" y="8" width="2" height="2" fill="#111"></rect><rect x="11" y="8" width="1" height="3" fill="#111"></rect><rect x="13" y="9" width="3" height="1" fill="#111"></rect><rect x="17" y="8" width="2" height="2" fill="#111"></rect>
        <rect x="0" y="9" width="2" height="1" fill="#111"></rect><rect x="3" y="8" width="1" height="3" fill="#111"></rect><rect x="5" y="10" width="2" height="1" fill="#111"></rect><rect x="19" y="11" width="2" height="2" fill="#111"></rect>
        <rect x="8" y="12" width="3" height="1" fill="#111"></rect><rect x="12" y="12" width="2" height="2" fill="#111"></rect><rect x="15" y="13" width="1" height="3" fill="#111"></rect><rect x="9" y="14" width="1" height="2" fill="#111"></rect>
        <rect x="11" y="16" width="3" height="1" fill="#111"></rect><rect x="17" y="15" width="3" height="1" fill="#111"></rect><rect x="8" y="18" width="2" height="2" fill="#111"></rect><rect x="12" y="19" width="2" height="2" fill="#111"></rect>
        <rect x="16" y="18" width="1" height="3" fill="#111"></rect><rect x="18" y="17" width="3" height="1" fill="#111"></rect><rect x="19" y="19" width="2" height="2" fill="#111"></rect>
      </svg>
    </div>
    <span style="font-size: 13px; font-weight: 600">Wave · Station Mbour</span>
    <span style="font-size: 12px; color: #A3B0AA">Compte marchand du propriétaire</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="ref" style="font-size: 13px; color: #A3B0AA">2. Référence affichée sur le téléphone du client</label>
    <input id="ref" value="T8K2-4QZP" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #0E1311; border: 1px solid #4A5852; color: #EEF2EF; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; letter-spacing: 1px">
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #13281E; border: 1px solid #2F6B4C; font-size: 13px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4CC38A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M20 6 9 17l-5-5"></path></svg>
    <span style="color: #BFE8D2">Paiement reçu sur le compte · 15 000 FCFA · 16:42</span>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <button style="height: 54px; border-radius: 14px; background: #F2A541; border: none; color: #1A1206; font-size: 16px; font-weight: 600">Enregistrer le paiement</button>
    <p style="margin: 0; font-size: 12px; color: #A3B0AA; text-align: center">L'argent arrive directement au propriétaire.</p>
  </div>
</div>
</body>
</html>
