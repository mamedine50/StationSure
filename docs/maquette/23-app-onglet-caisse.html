<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StationSûre — Onglet Caisse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#0E1311;font-family:'IBM Plex Sans',sans-serif;color:#EEF2EF}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 900px; display: flex; flex-direction: column; background: #0E1311; color: #EEF2EF; font-family: 'IBM Plex Sans', sans-serif">
  <div style="flex-grow: 1; box-sizing: border-box; padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 24px; font-weight: 700">Caisse</h1>
      <span style="font-size: 13px; color: #A3B0AA">Shift matin · Salif (gérant)</span>
    </div>

    <button style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 16px; background: #F2A541; border: none; color: #1A1206; font-size: 18px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1206" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>Encaisser</button>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; min-height: 92px; border-radius: 14px; background: #161D1A; border: 1px solid #2A3530; color: #EEF2EF; text-align: left"><span style="font-weight: 600; font-size: 15px">Vente à crédit</span><span style="font-size: 12px; color: #A3B0AA">Client connu, bon signé</span></button>
      <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; min-height: 92px; border-radius: 14px; background: #161D1A; border: 1px solid #2A3530; color: #EEF2EF; text-align: left"><span style="font-weight: 600; font-size: 15px">Demander une annulation</span><span style="font-size: 12px; color: #A3B0AA">Motif obligatoire</span></button>
      <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; min-height: 92px; border-radius: 14px; background: #161D1A; border: 1px solid #2A3530; color: #EEF2EF; text-align: left"><span style="font-weight: 600; font-size: 15px">Versement bancaire</span><span style="font-size: 12px; color: #F2A541">1 bordereau à faire</span></button>
      <button disabled style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; min-height: 92px; border-radius: 14px; background: #121815; border: 1px dashed #2A3530; color: #6F7D77; text-align: left"><span style="font-weight: 600; font-size: 15px">Clôturer la caisse</span><span style="font-size: 12px">Après « Fermer le shift »</span></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #A3B0AA">Paiements mobiles de mon shift</span>
      <div style="display: flex; flex-direction: column; border: 1px solid #2A3530; border-radius: 14px; background: #161D1A">
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-bottom: 1px solid #2A3530; font-size: 13px"><span style="flex-grow: 1">Wave · T8K2-4QZP</span><span style="font-family: 'IBM Plex Mono', monospace">15 000</span><span style="font-size: 11px; color: #4CC38A; font-weight: 600">rapproché</span></div>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; font-size: 13px"><span style="flex-grow: 1">Orange Money · OM88213</span><span style="font-family: 'IBM Plex Mono', monospace">10 000</span><span style="font-size: 11px; color: #F2A541; font-weight: 600">en attente</span></div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #161D1A; border: 1px solid #2A3530; font-size: 12px; color: #A3B0AA">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3B0AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      <span>Le montant attendu s'affiche seulement après votre billetage.</span>
    </div>
  </div>

  <nav aria-label="Navigation principale" style="height: 78px; flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #2A3530; background: #111816">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A3B0AA; text-decoration: none; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A3B0AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2z"></path></svg>Accueil</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A3B0AA; text-decoration: none; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A3B0AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22h12"></path><path d="M4 9h10"></path><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"></path><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0V9.83a2 2 0 0 0-.59-1.42L18 5"></path></svg>Carburant</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #F2A541; text-decoration: none; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2A541" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>Caisse</a>
    <a href="#" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A3B0AA; text-decoration: none; font-size: 11px"><span style="position: absolute; top: 10px; left: 55%; min-width: 18px; height: 18px; border-radius: 9px; background: #F2A541; color: #1A1206; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A3B0AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>Moi</a>
  </nav>
</div>
</body>
</html>
